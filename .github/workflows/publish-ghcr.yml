# Reusable image build + publish to GHCR under selfdothost.
# Called by each repo's publish workflow. Auth is the in-Actions GITHUB_TOKEN —
# no long-lived PAT is needed for GHCR (see docs/publish-secrets.md).
name: publish-ghcr

on:
  workflow_call:
    inputs:
      image:
        description: "Image path under ghcr.io/selfdothost (e.g. self.ai/api)"
        required: true
        type: string
      context:
        description: "Docker build context"
        default: "."
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        default: "Dockerfile"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/selfdothost/${{ inputs.image }}:latest
            ghcr.io/selfdothost/${{ inputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
