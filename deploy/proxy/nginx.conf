# Reverse proxy for the SPLIT deployment.
# Routes the API/websocket/inference path-prefixes to the `api` service and
# everything else to the `chat` (SPA) service, so the browser sees one origin.
# This reproduces what traefik does at the VIP in a clustered deployment.

upstream selfai_api {
    server api:8080;
}
upstream selfai_chat {
    server chat:8080;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 100m;

    # API, websockets, and inference/eval forwarders -> the API server.
    location ~ ^/(api|ws|ollama|openai|curator|language-eval|code-eval|llamolotl|static|cache|health)(/|$) {
        proxy_pass http://selfai_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /ws.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Everything else -> the static SPA.
    location / {
        proxy_pass http://selfai_chat;
        proxy_set_header Host $host;
    }
}

# Map for conditional WebSocket upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
