# self.ai CI — build the API server image and publish to container.home.
#
# Builds the backend only (api) into a slim, torch-free API image.
# kaniko (daemonless) NOT buildah — the runner pods have no /dev/fuse. Image
# lands at $CI_REGISTRY_IMAGE/api:<short-sha> (container.home...selfai/self.ai/api).
# Nothing builds on the bastion; Flux's ImagePolicy promotes from the registry.
#
# Runner #28 is run_untagged=false → every job carries a tag. The image build
# runs on `yard-midbuild` (2x 8c/16Gi floating) — off `bigbuild`, which is
# reserved for the heavy from-source builds (e.g. llamolotl).
#
# Submodules (eval/speech/inference repos) are NOT fetched — the API build needs
# only the backend tree.

stages: [lint, test, build, publish]

include:
  - local: '.gitlab/ci-templates/sync-public-alpha.yml'

default:
  tags: [yard]

variables:
  GIT_SUBMODULE_STRATEGY: none
  API_IMAGE: $CI_REGISTRY_IMAGE/api

# --- lint: ruff against api/ -------------------------------------------------
# First-ever Python lint gate for this repo (self.ai#28) — api/selfai_ui is a
# hard fork of Open-WebUI v0.5.4 that has never been ruff-checked, so the
# actual finding count is unknown until this runs for real. allow_failure:
# true until that backlog is triaged and burned down (mirrors how the eslint
# gate landed in self.chat: allow_failure first, then flipped once clean).
lint:ruff:
  stage: lint
  image: python:3.11-slim-bookworm
  before_script:
    - pip install --no-cache-dir ruff~=0.6.9
  script:
    - cd api && ruff check .

# --- test: pytest against api/tests/ ----------------------------------------
# Plain pip install (not the kaniko/Dockerfile path) against requirements-api.txt
# (the slim, torch-free API-tier set) + requirements-dev.txt (test-only extras).
# Runs on MR + main when the backend changes.
#
# Blocking (self.ai#26 resolved 2026-07-09: 495 passed, 4 xfailed, 0 failed,
# confirmed on pipeline 3289). Was allow_failure while
# test_audio_config_update_persists/test_audio_speech_requires_payload were
# broken -- both fixed, and the SERVICE_AUTH_SECRET gap that separately broke
# 2 job-state-machine tests on self.ai#25's ticket wiring is fixed too.
test:api:
  stage: test
  image: python:3.11-slim-bookworm
  timeout: 20m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential gcc python3-dev && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir -r api/requirements-api.txt -r api/requirements-dev.txt
  script:
    - cd api && python -m pytest tests -q -m "not gpu and not integration"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [api/**/*]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [api/**/*]

# --- build: slim FastAPI (selfai_ui) API image ------------------------------
# Runs on MR + main when the backend changes (not on doc/manifest-only commits).
build:api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags: [yard-midbuild]
  timeout: 1h
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_JOB_TOKEN" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR/api"
      --dockerfile "$CI_PROJECT_DIR/api/Dockerfile"
      --build-arg BUILD_HASH="$CI_COMMIT_SHORT_SHA"
      --cache=false
      --destination "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$API_IMAGE:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [api/**/*]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [api/**/*]

# --- publish: mirror main -> public-alpha (GitLab + GitHub), scheduled only -
sync:public-alpha:
  extends: .sync-public-alpha
  variables:
    MIRROR_EXCLUDE_PATHS: "context manifests"
