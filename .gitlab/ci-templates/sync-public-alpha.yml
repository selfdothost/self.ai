# Reusable job: strip `main` down to its public-safe subset, commit the
# result onto the protected `public-alpha` branch, and push that branch both
# back to GitLab and to the matching selfdothost/<repo> GitHub mirror.
#
# Included by each of the 6 alpha-publish repos' own .gitlab-ci.yml. Runs on
# a GitLab Pipeline Schedule only (never on ordinary push/MR pipelines) — set
# the schedule's ref to `main` so it always picks up the latest version of
# this template, and set MIRROR_EXCLUDE_PATHS as a schedule/project variable
# per repo (space-separated top-level paths to drop; empty if none).
#
# Requires three masked CI/CD variables, set once at the selfshipyard/selfai
# GROUP level so every repo inherits them without repeating the secret per
# project:
#   GITHUB_MIRROR_USER  — GitHub username for the PAT (vault:
#                          secret/selfshipyard/selfai/publish/github#username)
#   GITHUB_MIRROR_TOKEN — the PAT itself (same vault path, #token)
#   GITLAB_PUBLISH_TOKEN — the selfai-publish group access token (Developer
#                          role, write_repository scope only). CI_JOB_TOKEN
#                          can't push to a protected branch here, so the
#                          GitLab-side push authenticates as this bot instead.
#
# Requires `public-alpha` be a protected branch on this project with push
# access granted to Developers (the selfai-publish bot's role) — Settings ->
# Repository -> Protected branches. Without this the push-back to GitLab
# fails with a permission error even though the GitHub push succeeds.
#
# Scans the FILTERED tree (post-exclusion) for secrets/yard hostnames before
# pushing anywhere — same patterns as self.ai's scripts/publish/scan-public.sh,
# inlined here since this template runs standalone in each repo's CI, not just
# self.ai's.

.sync-public-alpha:
  stage: publish
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git bash grep
  script:
    - |
      set -euo pipefail
      REPO_NAME="${CI_PROJECT_NAME}"
      EXCLUDES="${MIRROR_EXCLUDE_PATHS:-}"

      git config user.email "ci@self.ai"
      git config user.name "self.ai mirror sync"

      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch origin main --quiet
      git checkout -B main origin/main

      # Build the filtered snapshot in a scratch dir via git-archive (only
      # tracked files, respects .gitattributes export-ignore if ever added).
      rm -rf /tmp/mirror-snapshot
      mkdir -p /tmp/mirror-snapshot
      git archive main | tar -x -C /tmp/mirror-snapshot

      for p in $EXCLUDES; do
        echo "excluding: $p"
        rm -rf "/tmp/mirror-snapshot/${p:?}"
      done

      # --- secret / hostname scan on the filtered tree only -----------------
      fail=0
      if grep -rnEI 'home\.mateysmarsh\.com|172\.20\.[0-9]+\.[0-9]+|172\.16\.[0-9]+\.[0-9]+' /tmp/mirror-snapshot; then
        echo "internal hostname/IP found in filtered tree" >&2
        fail=1
      fi
      if grep -rnEI \
          -e 'BEGIN [A-Z ]*PRIVATE KEY' \
          -e '(ghp|gho|ghs|github_pat)_[A-Za-z0-9_]{20,}' \
          -e 'AKIA[0-9A-Z]{16}' \
          -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
          /tmp/mirror-snapshot | grep -viE 'REPLACE_ME|example|placeholder|change-me'; then
        echo "possible secret found in filtered tree" >&2
        fail=1
      fi
      if [ -f /tmp/mirror-snapshot/.env ]; then
        echo "a real .env file is in the filtered tree" >&2
        fail=1
      fi
      if [ "$fail" -ne 0 ]; then
        echo "SYNC ABORTED — scan failed, nothing pushed anywhere." >&2
        exit 1
      fi
      echo "scan clean."

      # --- update local public-alpha to the filtered snapshot --------------
      if git ls-remote --exit-code --heads origin public-alpha >/dev/null 2>&1; then
        git fetch origin public-alpha --quiet
        git checkout -B public-alpha origin/public-alpha
      else
        git checkout --orphan public-alpha
        git rm -rf . --quiet >/dev/null 2>&1 || true
      fi

      find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
      cp -a /tmp/mirror-snapshot/. .

      git add -A
      if git diff --cached --quiet; then
        echo "no changes since last sync — nothing to push"
        exit 0
      fi

      git commit -m "sync: mirror main@$(git rev-parse --short origin/main) to public-alpha"

      # Push as the selfai-publish bot (group access token, Developer role,
      # write_repository only) — NOT CI_JOB_TOKEN, which can't push to a
      # protected branch here. public-alpha's protected-branch push access is
      # granted to Developers specifically so this bot (and only intentional,
      # explicitly-provisioned identities at that role) can push it.
      git push "https://selfai-publish:${GITLAB_PUBLISH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" public-alpha:public-alpha
      git push "https://${GITHUB_MIRROR_USER}:${GITHUB_MIRROR_TOKEN}@github.com/selfdothost/${REPO_NAME}.git" public-alpha:public-alpha
